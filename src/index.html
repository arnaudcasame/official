<!doctype html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <title><%= htmlWebpackPlugin.options.title %></title>
        <meta name="viewport" content="width=device-width, user-scalable=no">
        <meta http-equiv="x-ua-compatible" content="ie=edge">
        <meta name="description" content="Arnaud Casamé's presentation web site">
    </head>

    <body>
        <section class="main show" id="overall">
            <article class="container">
                <div class="anim-wrapper">
                    <i class="fa fa-desktop" id="desktop"></i> 
                    <i class="fa fa-laptop" id="laptop"></i> 
                    <i class="fa fa-mobile" id="mobile"></i>
                    <i class="fa fa-database" id="database"></i>
                    <div class="pic-wrapper">
                        <img id="main-hero" alt="Picture of Arnaud Casamé">
                    </div>
                </div>
                <p>Hi, I'm <span>Arnaud Casamé</span>. I'm a <span>Software Engineer.</span></p>
                <p class="nav down"><a><i class="fa fa-angle-down"></i></a></p>
            </article>
            <article class="desktop">
                <div class="icons" id="dsk-icons">
                    <button class="t-btn medium">
                        <div class="icon-inner">
                            <i class="fa fa-free-code-camp green" aria-hidden="true"></i>
                            <span class="label">freeCodeCamp</span>
                        </div>
                    </button>

                    <button class="t-btn medium">
                        <div class="icon-inner">
                            <i class="fa fa-codepen grey" aria-hidden="true"></i>
                            <span class="label">Codepen</span>
                        </div>
                    </button>

                    <button class="t-btn medium">
                        <div class="icon-inner">
                            <i class="fa fa-chrome white" aria-hidden="true"></i>
                            <span class="label">Chrome</span>
                        </div>
                    </button>

                    <button class="t-btn medium">
                        <div class="icon-inner">
                            <i class="fa fa-slack aubergine" aria-hidden="true"></i>
                            <span class="label">Slack</span>
                        </div>
                    </button>

                    <button class="t-btn medium">
                        <div class="icon-inner">
                            <i class="fa fa-linux black" aria-hidden="true"></i>
                            <span class="label">Linux</span>
                        </div>
                    </button>

                    <button class="t-btn medium">
                        <div class="icon-inner">
                            <i class="fa fa-linkedin-square blue" aria-hidden="true"></i>
                            <span class="label">LinkedIn</span>
                        </div>
                    </button>

                    <button class="t-btn medium">
                        <div class="icon-inner">
                            <i class="fa fa-apple black" aria-hidden="true"></i>
                            <span class="label">Apple</span>
                        </div>
                    </button>

                    <button class="t-btn medium">
                        <div class="icon-inner">
                            <i class="fa fa-android light-green" aria-hidden="true"></i>
                            <span class="label">Android</span>
                        </div>
                    </button>

                    <button class="t-btn medium">
                        <div class="icon-inner">
                            <i class="fa fa-firefox orange" aria-hidden="true"></i>
                            <span class="label">Firefox</span>
                        </div>
                    </button>

                    <button class="t-btn medium">
                        <div class="icon-inner">
                            <i class="fa fa-pinterest red" aria-hidden="true"></i>
                            <span class="label">Pinterest</span>
                        </div>
                    </button>

                    <button class="t-btn medium">
                        <div class="icon-inner">
                            <i class="fa fa-skype sky-blue" aria-hidden="true"></i>
                            <span class="label">Skype</span>
                        </div>
                    </button>
                </div>
                <div class="menu" id="dsk-main-menu">
                    <div class="search">
                        <div class="field">
                            <i class="fa fa-search" aria-hidden="true"></i>
                            <input type="search" name="search" id="task-search" placeholder="Search for apps, settings and documents">
                        </div>
                    </div>
                    <div class="pinned item">
                        <div class="inner">
                            <div class="header">
                                <h3>Pinned</h3>
                                <span>
                                    All apps
                                    <i class="fa fa-angle-right" aria-hidden="true"></i>
                                </span>
                            </div>
                            <div class="content y-scrollable">
                                <div class="btns">
                                    <button class="t-btn small">
                                        <div class="btn-inner">
                                            <i class="fa fa-free-code-camp green" aria-hidden="true"></i>
                                            <span class="label">freeCodeCamp</span>
                                        </div>
                                    </button>
                
                                    <button class="t-btn small">
                                        <div class="btn-inner">
                                            <i class="fa fa-codepen grey" aria-hidden="true"></i>
                                            <span class="label">Codepen</span>
                                        </div>
                                    </button>

                                    <button class="t-btn small">
                                        <div class="btn-inner">
                                            <i class="fa fa-youtube-play red" aria-hidden="true"></i>
                                            <span class="label">YouTube</span>
                                        </div>
                                    </button>
                
                                    <button class="t-btn small">
                                        <div class="btn-inner">
                                            <i class="fa fa-slack aubergine" aria-hidden="true"></i>
                                            <span class="label">Slack</span>
                                        </div>
                                    </button>
                
                                    <button class="t-btn small">
                                        <div class="btn-inner">
                                            <i class="fa fa-linux black" aria-hidden="true"></i>
                                            <span class="label">Linux</span>
                                        </div>
                                    </button>
                
                                    <button class="t-btn small">
                                        <div class="btn-inner">
                                            <i class="fa fa-linkedin-square blue" aria-hidden="true"></i>
                                            <span class="label">LinkedIn</span>
                                        </div>
                                    </button>
                
                                    <button class="t-btn small">
                                        <div class="btn-inner">
                                            <i class="fa fa-apple black" aria-hidden="true"></i>
                                            <span class="label">Apple</span>
                                        </div>
                                    </button>
                
                                    <button class="t-btn small">
                                        <div class="btn-inner">
                                            <i class="fa fa-android light-green" aria-hidden="true"></i>
                                            <span class="label">Android</span>
                                        </div>
                                    </button>
                
                                    <button class="t-btn small">
                                        <div class="btn-inner">
                                            <i class="fa fa-firefox orange" aria-hidden="true"></i>
                                            <span class="label">Firefox</span>
                                        </div>
                                    </button>

                                    <button class="t-btn small">
                                        <div class="btn-inner">
                                            <i class="fa fa-trello blue" aria-hidden="true"></i>
                                            <span class="label">Trello</span>
                                        </div>
                                    </button>

                                    <button class="t-btn small">
                                        <div class="btn-inner">
                                            <i class="fa fa-twitter sky-blue" aria-hidden="true"></i>
                                            <span class="label">Twitter</span>
                                        </div>
                                    </button>

                                    <button class="t-btn small">
                                        <div class="btn-inner">
                                            <i class="fa fa-chrome white" aria-hidden="true"></i>
                                            <span class="label">Chrome</span>
                                        </div>
                                    </button>

                                    <button class="t-btn small">
                                        <div class="btn-inner">
                                            <i class="fa fa-pinterest red" aria-hidden="true"></i>
                                            <span class="label">Pinterest</span>
                                        </div>
                                    </button>

                                    <button class="t-btn small">
                                        <div class="btn-inner">
                                            <i class="fa fa-skype sky-blue" aria-hidden="true"></i>
                                            <span class="label">Skype</span>
                                        </div>
                                    </button>

                                    <button class="t-btn small">
                                        <div class="btn-inner">
                                            <i class="fa fa-whatsapp green" aria-hidden="true"></i>
                                            <span class="label">WhatsApp</span>
                                        </div>
                                    </button>

                                    <button class="t-btn small">
                                        <div class="btn-inner">
                                            <i class="fa fa-github black" aria-hidden="true"></i>
                                            <span class="label">Github</span>
                                        </div>
                                    </button>

                                    <button class="t-btn small">
                                        <div class="btn-inner">
                                            <i class="fa fa-html5 orange" aria-hidden="true"></i>
                                            <span class="label">HTML5</span>
                                        </div>
                                    </button>

                                    <button class="t-btn small">
                                        <div class="btn-inner">
                                            <i class="fa fa-css3 violet" aria-hidden="true"></i>
                                            <span class="label">CSS3</span>
                                        </div>
                                    </button>

                                    <button class="t-btn small">
                                        <div class="btn-inner">
                                            <i class="fa fa-meetup pink" aria-hidden="true"></i>
                                            <span class="label">Meetup</span>
                                        </div>
                                    </button>

                                    <button class="t-btn small">
                                        <div class="btn-inner">
                                            <i class="fa fa-folder gold" aria-hidden="true"></i>
                                            <span class="label">File Explorer</span>
                                        </div>
                                    </button>

                                    <button class="t-btn small">
                                        <div class="btn-inner">
                                            <i class="fa fa-amazon white" aria-hidden="true"></i>
                                            <span class="label">Amazon</span>
                                        </div>
                                    </button>

                                    <button class="t-btn small">
                                        <div class="btn-inner">
                                            <i class="fa fa-git orange" aria-hidden="true"></i>
                                            <span class="label">Git</span>
                                        </div>
                                    </button>

                                    <button class="t-btn small">
                                        <div class="btn-inner">
                                            <i class="fa fa-paypal blue" aria-hidden="true"></i>
                                            <span class="label">Paypal</span>
                                        </div>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="recommended item">
                        <div class="inner">
                            <div class="header">
                                <h3>Recommended</h3>
                                <span>
                                    More
                                    <i class="fa fa-angle-right" aria-hidden="true"></i>
                                </span>
                            </div>
                            <div class="content"></div>
                        </div>
                    </div>
                    <div class="profile">
                        <div class="wrap-profile">
                            <div class="pic-n-name">
                                <div class="pic">
                                    <i class="fa fa-user-circle-o" aria-hidden="true"></i>
                                </div>
                                <span class="name">Guest</span>
                            </div>
                            <button class="power">
                                <i class="fa fa-power-off" aria-hidden="true"></i>
                            </button>
                        </div>
                    </div>
                </div>
                <div class="explorer">
                    <div class="header">
                        <div class="win-title">
                            <i class="fa fa-arrow-down"></i>
                            <p class="title">Downloads</p>
                        </div>
                        <div class="win-btns">
                            <button>
                                <i class="fa fa-minus"></i>
                            </button>
                            <button>
                                <i class="fa fa-window-maximize"></i>
                            </button>
                            <button>
                                <i class="fa fa-times"></i>
                            </button>
                        </div>
                    </div>
                    <div class="address-bar">
                        <button class="nav-btn">
                            <i class="fa fa-arrow-left"></i>
                        </button>
                        <button class="nav-btn">
                            <i class="fa fa-arrow-right"></i>
                        </button>
                        <button class="nav-btn">
                            <i class="fa fa-arrow-up"></i>
                        </button>
                        <button class="nav-btn">
                            <i class="fa fa-repeat"></i>
                        </button>
                        <div class="field-wrapper">
                            <div class="placeholder">
                                <i class="fa fa-tv"></i>
                                <i class="fa fa-angle-right"></i>
                                <span>Downloads</span>
                                <i class="fa fa-angle-right"></i>
                            </div>
                            <input type="text" name="address">
                        </div>
                        <div class="field-wrapper">
                            <input type="text" name="search-window" placeholder="Search Downloads">
                        </div>
                    </div>
                    <div class="tool-bar"></div>
                    <div class="middle">
                        <div class="side-bar"></div>
                        <div class="content"></div>
                    </div>
                    <div class="footer"></div>
                </div>
            </article>
            <div class="task-bar">
                <div class="left"></div>
                <div class="center" id="center-task">
                    <button class="t-btn" data-name="main-menu">
                        <i class="fa fa-windows white" data-name="main-menu-icon"></i>
                    </button>
                    <div class="field">
                        <i class="fa fa-search" aria-hidden="true"></i>
                        <input type="search" name="search" id="task-search" placeholder="Search">
                    </div>
                    <button class="t-btn">
                        <i class="fa fa-edge white"></i>
                    </button>
                    <button class="t-btn">
                        <i class="fa fa-folder gold"></i>
                    </button>
                    <button class="t-btn">
                        <i class="fa fa-github white"></i>
                    </button>
                </div>
                <div class="right" id="right-task">
                    <button class="t-btn">
                        <i class="fa fa-angle-up white"></i>
                    </button>
                    <button class="clock t-btn">
                        <div class="wrapper">
                            <span>6:30 PM</span>
                            <span>6/14/2024</span>
                        </div>
                    </button>
                    <button class="t-btn">
                        <i class="fa fa-bell-o white"></i>
                    </button>
                </div>
            </div>
        </section>
        <script>
            (function (b, o, i, l, e, r) {
                b.GoogleAnalyticsObject = l; b[l] || (b[l] =
                    function () { (b[l].q = b[l].q || []).push(arguments) }); b[l].l = +new Date;

                r.parentNode.insertBefore(e, r)
            }(window, document, 'script', 'ga'));
            ga('create', 'UA-XXXXX-X', 'auto'); ga('send', 'pageview');
        </script>
    </body>

</html>
